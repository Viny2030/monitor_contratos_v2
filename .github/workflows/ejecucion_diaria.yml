name: Monitor Diario Integrado BORA y Compras
on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:
permissions:
  contents: write # IMPORTANTE para que el robot pueda subir el Excel
jobs:
  run-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código (Checkout)
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar librerías
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests beautifulsoup4 openpyxl lxml
      - name: Ejecutar Ciclo Integrado
        run: python diario.py
      - name: Guardar Reporte y Sincronizar
        run: |
          git config --global user.name 'Robot Monitor'
          git config --global user.email 'robot@noreply.github.com'
          git add data/
          git commit -m "Reporte Integrado BORA-COMPRAR-TGN: $(date +'%Y-%m-%d')" || exit 0
          git push origin HEAD
