name: Monitor Diario Integrado BORA y Compras

on:
  schedule:
    - cron: '0 11 * * *'   # 08:00 Argentina (UTC-3)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código (Checkout)
        uses: actions/checkout@v4
        with:
          ref: desarrollo
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar librerías
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests beautifulsoup4 openpyxl lxml pdfminer.six

      - name: Ejecutar Ciclo Integrado
        run: python diario.py

      - name: Guardar Reporte y Sincronizar
        run: |
          git config --global user.name 'Robot Monitor'
          git config --global user.email 'robot@noreply.github.com'
          git add data/
          git diff --staged --quiet && echo "Sin cambios, nada que commitear" && exit 0
          git commit -m "Reporte Integrado BORA-COMPRAR-TGN: $(date +'%Y-%m-%d')"
          git push origin HEAD:desarrollo
          git checkout main
          git merge desarrollo --no-edit
          git push origin main
